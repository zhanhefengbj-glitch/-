<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面宠物</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #pet {
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: pointer;
        user-select: none;
        -webkit-user-drag: none;
      }

      #pet.nod {
        animation: nod 240ms ease-in-out;
      }

      @keyframes nod {
        0%,
        100% {
          transform: translateY(0);
        }
        45% {
          transform: translateY(12px);
        }
        70% {
          transform: translateY(-3px);
        }
      }
    </style>
  </head>
  <body>
    <img id="pet" src="./assets/idle.png" alt="桌面宠物" draggable="false" />
    <script src="./renderer.js"></script>
  </body>
</html>
